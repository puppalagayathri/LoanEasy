{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful - LoanEasy</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
           min-height: 100vh;
           overflow: hidden;

           display: flex;
           justify-content: center;
           align-items: center;
        }

        /* BACKGROUND VIDEO */

        .video-background {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;
        }

        /* VIDEO OVERLAY */

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(255, 255, 255, 0.25);

            z-index: -1;
        }

        /* SUCCESS BOX */

       .success-box {
           width: 450px;
           padding: 45px 35px;

          background: rgba(255, 255, 255, 0.94);
          text-align: center;
          border-radius: 12px;
          box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
       }

        .success-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            color: #003366;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
            font-size: 16px;
        }

        /* BUTTONS */

        .button {
            display: inline-block;

            padding: 12px 25px;

            margin: 5px;

            text-decoration: none;

            border-radius: 6px;

            font-weight: bold;
        }

        .login-button {
            background: #003366;
            color: white;
        }

        .home-button {
            background: #ff9800;
            color: white;
        }

        .login-button:hover {
            background: #00264d;
        }

        .home-button:hover {
            background: #e68900;
        }

    </style>

</head>

<body>

    <!-- BACKGROUND VIDEO -->

    <video class="video-background" autoplay muted loop playsinline>

        <source src="{% static 'videos/registration.mp4' %}" type="video/mp4">

    </video>


    <!-- VIDEO OVERLAY -->

    <div class="video-overlay"></div>


    <!-- SUCCESS MESSAGE -->

    <div class="success-box">

        <div class="success-icon">
            ✅
        </div>

        <h2>Successfully Registered!</h2>

        <p>
            Your LoanEasy account has been created successfully.
            You can now login and continue your application.
        </p>

        <a href="{% url 'login' %}" class="button login-button">
            Go to Login
        </a>

        <a href="/" class="button home-button">
            Back to Home
        </a>

    </div>

</body>

</html>
