{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LoanEasy - Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
        }

        /* BACKGROUND VIDEO */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;
        }

        /* VIDEO OVERLAY */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(255, 255, 255, 0.25);

            z-index: -1;
        }

        /* REGISTRATION BOX */
        .register-box {
            width: 450px;

            margin: 60px auto;

            background: rgba(255, 255, 255, 0.94);

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);

            color: #222;
        }

        /* HEADING */
        h2 {
            text-align: center;

            margin-bottom: 25px;

            color: #003366;

            font-size: 28px;
        }

        /* FORM */
        table {
            width: 100%;
        }

        td {
            padding: 7px;
        }

        input,
        select {
            padding: 8px;

            width: 100%;

            border: 1px solid #bbb;

            border-radius: 5px;
        }

        /* BUTTON */
        button {
            padding: 10px 25px;

            background: #ff9800;

            color: white;

            border: none;

            border-radius: 5px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #e68900;
        }

    </style>

</head>

<body>

    <!-- BACKGROUND VIDEO -->

    <video class="video-background" autoplay muted loop playsinline>

        <source src="{% static 'videos/registration.mp4' %}" type="video/mp4">

    </video>


    <!-- VIDEO OVERLAY -->

    <div class="video-overlay"></div>


    <!-- REGISTRATION FORM -->

    <div class="register-box">

        <h2>Customer Registration</h2>

        <form method="POST">

            {% csrf_token %}

            <table>
                {{ form.as_table }}
            </table>

            <br>

            <div style="text-align:center;">

                <button type="submit">
                    Submit
                </button>

            </div>

        </form>

    </div>

</body>

</html>
